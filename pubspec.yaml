name: flutter_mysale
description: "MySale Mobile App"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  dio: ^5.3.3
  provider: ^6.1.1
  url_launcher: ^6.2.1
  local_auth: ^2.1.7
  flutter_local_notifications: ^17.2.1
  flutter_dotenv: ^5.1.0
